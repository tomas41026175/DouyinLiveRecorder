name: test

on:
  push:
    branches: [main]
  pull_request:
  # upstream-spider-sync.yml 用 GITHUB_TOKEN 開的 PR 不會觸發 pull_request，
  # 沒設 SPIDER_SYNC_TOKEN 時由它在分支上 `gh workflow run test.yml --ref <branch>`。
  # job 名稱（unittest (3.10)/(3.13)）是 branch protection 的 required check，不可改名。
  workflow_dispatch:

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        # requires-python >=3.10；recorder 用精簡可攜 Python，兩端都測
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests (stdlib unittest, no deps)
        run: python -m unittest discover -s tests -v
